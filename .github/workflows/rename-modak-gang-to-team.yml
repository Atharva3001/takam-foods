name: Rename Modak Gang to Modak Team

on:
  push:
    branches: [main]

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace website wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("client/src")
          replacements = {
              "Modak Gang": "Modak Team",
              "Modak gang": "Modak Team",
              "modak gang": "Modak Team",
              "Modak gang!": "Modak Team!",
              "मोदक gang": "मोदक team",
              "सगळी gang": "सगळी team",
          }

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".ts", ".tsx", ".css"}:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

      - name: Verify no Modak Gang wording remains
        run: |
          if grep -RniE 'Modak Gang|Modak gang|modak gang|मोदक gang|सगळी gang' client/src --include='*.ts' --include='*.tsx' --include='*.css'; then
            echo "Old Modak Gang wording still exists."
            exit 1
          fi

      - name: Build website
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit website wording change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No wording changes needed."
            exit 0
          fi
          git add client/src
          git commit -m "fix: rename Modak Gang to Modak Team"
          git push origin main

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/rename-modak-gang-to-team.yml
          git add .github/workflows/rename-modak-gang-to-team.yml
          git commit -m "chore: remove temporary rename workflow"
          git push origin main
