name: Fix Khava image and product galleries

on:
  push:
    branches: [feature/order-capacity-dashboard]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: Khava image and galleries')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-capacity-dashboard
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          products = Path('client/src/lib/products.ts')
          s = products.read_text()
          if 'import khavaModakImage from "@/assets/khavaModakImage";' not in s:
              s = 'import khavaModakImage from "@/assets/khavaModakImage";\n\n' + s
          s = s.replace('images: ["/images/takam_modak_khava.webp"],', 'images: [khavaModakImage],')
          products.write_text(s)

          page = Path('client/src/pages/ProductPage.tsx')
          s = page.read_text()
          s = s.replace('import { MessageCircle, ArrowLeft, PlayCircle, ChevronRight, Plus } from "lucide-react";', 'import { MessageCircle, ArrowLeft, ChevronRight, Plus } from "lucide-react";')
          s = s.replace('import { MessageCircle, ArrowLeft, PlayCircle, ChevronRight } from "lucide-react";', 'import { MessageCircle, ArrowLeft, ChevronRight } from "lucide-react";')
          import re
          s = re.sub(r'\n\s*const \[activeImage, setActiveImage\] = useState\(0\);', '', s)
          s = re.sub(r'\n\s*const isMascotSrc = \(src: string\) =>[^;]+;\n\s*const isMascotAsset = isMascotSrc\(product\.images\[activeImage\] \?\? ""\);', '\n  const primaryImage = product.images[0] ?? "";\n  const isMascotAsset = primaryImage.includes("takam_modak_") || primaryImage.includes("ukadiche_modak_hero_mascot") || primaryImage.startsWith("data:image/");', s)
          s = s.replace('src={product.images[activeImage]} alt={`${product.marathi} photo ${activeImage + 1}`} decoding="async" fetchPriority="high" className={`w-full h-80 md:h-[26rem] border-2 border-ink/15 ${isMascotAsset ? "object-contain bg-mint/20 p-5" : "object-cover saturate-[1.15]"}`}', 'src={primaryImage} alt={`${product.marathi} official graphic`} decoding="async" fetchPriority="high" className="w-full h-80 md:h-[26rem] border-2 border-ink/15 object-contain bg-mint/20 p-5"')
          gallery = re.compile(r'\n\s*<div className="flex gap-3 flex-wrap pt-2">.*?</div>\n\s*</div>\n\s*\n\s*<div className="space-y-6">', re.S)
          s, count = gallery.subn('\n            </div>\n\n            <div className="space-y-6">', s, count=1)
          if count != 1:
              raise SystemExit('Could not remove product image gallery block')
          s = s.replace('{isMascotAsset ? "✨ Modak चा official Takam avatar" : "📸 straight from आमची kitchen"}', '{isMascotAsset ? "✨ Modak चा official Takam avatar" : "📸 straight from आमची kitchen"}')
          page.write_text(s)

          legacy = Path('client/public/images/takam_modak_khava.webp')
          if legacy.exists():
              legacy.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/lib/products.ts client/src/pages/ProductPage.tsx client/public/images/takam_modak_khava.webp .github/workflows/fix-khava-and-galleries.yml
          git commit -m "fix: Khava image and galleries"
          git push origin HEAD:feature/order-capacity-dashboard
      - name: Remove workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/fix-khava-and-galleries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove one-time Khava fix workflow"
          git push origin HEAD:feature/order-capacity-dashboard
