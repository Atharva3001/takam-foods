name: Apply order dashboard fixes

on:
  push:
    branches:
      - feature/order-capacity-dashboard

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'feat: add order delete and single modak images')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-capacity-dashboard
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('server/dashboard-api.ts'); s=p.read_text(); m='  app.patch("/api/dashboard/orders/:id", async (req, res) => {'; r='''  app.delete("/api/dashboard/orders/:id", async (req, res) => {\n    const state = await readDashboard();\n    const index = state.orders.findIndex((item) => item.id === req.params.id);\n    if (index === -1) return sendError(res, "Order not found", 404);\n    const [deletedOrder] = state.orders.splice(index, 1);\n    await writeDashboard(state);\n    res.json({ ok: true, order: deletedOrder });\n  });\n'''; s=s if 'app.delete("/api/dashboard/orders/:id"' in s else s.replace(m,r+m,1); p.write_text(s)
          p=Path('client/src/pages/OrderDashboard.tsx'); s=p.read_text(); s=s.replace('import { ArrowLeft, CheckCircle2, CircleAlert, LogOut, PackagePlus, Plus, RefreshCw, Settings2 } from "lucide-react";','import { ArrowLeft, CheckCircle2, CircleAlert, LogOut, PackagePlus, Plus, RefreshCw, Settings2, Trash2 } from "lucide-react";'); m='  async function signOut() {'; f='''  async function deleteOrder(order: Order) {\n    if (!window.confirm(`Delete ${order.orderNumber} for ${order.customerName}?\\n\\nThis will also release its Modak quantity from production capacity.`)) return;\n    setSaving(true);\n    try {\n      const response = await fetch(`/api/dashboard/orders/${order.id}`, { method: "DELETE" });\n      if (!response.ok) { const body = await response.json().catch(() => ({})); window.alert(body.error || "Could not delete the order."); return; }\n      await load();\n    } finally { setSaving(false); }\n  }\n\n'''; s=s if 'async function deleteOrder(order: Order)' in s else s.replace(m,f+m,1); s=s.replace('<th className="p-3">Payment</th></tr></thead>','<th className="p-3">Payment</th><th className="p-3">Action</th></tr></thead>'); old='<td className="p-3"><select value={o.paymentStatus} onChange={(e) => patchOrder(o.id, { paymentStatus: e.target.value as Order["paymentStatus"] })} className="rounded-lg border-2 border-ink bg-white px-2 py-1 font-bold">{paymentStatuses.map(s => <option key={s}>{s}</option>)}</select></td></tr>)}</tbody>'; new='<td className="p-3"><select value={o.paymentStatus} onChange={(e) => patchOrder(o.id, { paymentStatus: e.target.value as Order["paymentStatus"] })} className="rounded-lg border-2 border-ink bg-white px-2 py-1 font-bold">{paymentStatuses.map(s => <option key={s}>{s}</option>)}</select></td><td className="p-3"><button type="button" onClick={() => deleteOrder(o)} disabled={saving} className="sticker-btn bg-peach px-3 py-2 text-xs" title="Delete order"><Trash2 size={15} /> Delete</button></td></tr>)}</tbody>'; s=s.replace(old,new,1); s=s.replace('<td colSpan={7} className="p-10 text-center font-bold text-muted-foreground">No orders found.</td>','<td colSpan={8} className="p-10 text-center font-bold text-muted-foreground">No orders found.</td>'); p.write_text(s)
          p=Path('client/src/pages/ProductPage.tsx'); s=p.read_text(); s=s.replace('  const [activeImage, setActiveImage] = useState(0);\n',''); old='''  const isMascotSrc = (src: string) => src.includes("takam_modak_") || src.includes("ukadiche_modak_hero_mascot");\n  const isMascotAsset = isMascotSrc(product.images[activeImage] ?? "");\n'''; new='''  const primaryImage = product.images[0] ?? "";\n  const isMascotAsset = primaryImage.includes("takam_modak_") || primaryImage.includes("ukadiche_modak_hero_mascot");\n'''; s=s.replace(old,new,1); s=s.replace('''<img src={product.images[activeImage]} alt={`${product.marathi} photo ${activeImage + 1}`} decoding="async" fetchPriority="high" className={`w-full h-80 md:h-[26rem] border-2 border-ink/15 ${isMascotAsset ? "object-contain bg-mint/20 p-5" : "object-cover saturate-[1.15]"}`} />''','''<img src={primaryImage} alt={`${product.marathi} official graphic`} decoding="async" fetchPriority="high" className="w-full h-80 md:h-[26rem] border-2 border-ink/15 object-contain bg-mint/20 p-5" />''',1); gs='              <div className="flex gap-3 flex-wrap pt-2">'; start=s.find(gs); end=s.find('              </div>\n            </div>',start); s=s if start<0 or end<0 else s[:start]+s[end+len('              </div>\n'):]; p.write_text(s)
          p=Path('client/src/lib/products.ts'); s=p.read_text().replace('images: ["/manus-storage/takam_modak_khava_opaque_cream_af814046.png"],','images: ["/images/takam_modak_khava.webp"],',1); p.write_text(s)
          PY
          rm -f .github/workflows/apply-order-dashboard-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/dashboard-api.ts client/src/pages/OrderDashboard.tsx client/src/pages/ProductPage.tsx client/src/lib/products.ts .github/workflows/apply-order-dashboard-fixes.yml
          git commit -m "feat: add order delete and single modak images"
          git push origin HEAD:feature/order-capacity-dashboard

