name: Fix dashboard write race

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unsafe dashboard writes from read-only endpoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/dashboard-api.ts')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('  if (repairMissingOrderAmounts(state)) await writeDashboard(state);\n  res.json(state);', '  res.json(state);'),
            ('    await writeDashboard(state); res.json({ date, schedule, products:', '    res.json({ date, schedule, products:'),
            ('    await writeDashboard(state); res.json(products.map((product) => ({ ...product, committed:', '    res.json(products.map((product) => ({ ...product, committed:'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/dashboard-api.ts
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "fix: prevent dashboard read endpoints from overwriting orders"
            git push origin main
          fi
          git rm .github/workflows/fix-dashboard-write-race.yml
          git commit -m "chore: remove temporary dashboard race workflow"
          git push origin main
