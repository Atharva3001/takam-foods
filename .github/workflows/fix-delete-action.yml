name: Fix delete action UI

on:
  push:
    branches: [feature/order-capacity-dashboard]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: show delete action')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-capacity-dashboard
          fetch-depth: 0
      - name: Add delete action cell
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/OrderDashboard.tsx')
          s = p.read_text()
          old = '<td className="p-3"><select value={o.paymentStatus} onChange={(e) => patchOrder(o.id, { paymentStatus: e.target.value as Order["paymentStatus"] })} className="rounded-lg border-2 border-ink bg-white px-2 py-1 font-bold">{paymentStatuses.map(s => <option key={s}>{s}</option>)}</select></td></tr>)}'
          new = '<td className="p-3"><select value={o.paymentStatus} onChange={(e) => patchOrder(o.id, { paymentStatus: e.target.value as Order["paymentStatus"] })} className="rounded-lg border-2 border-ink bg-white px-2 py-1 font-bold">{paymentStatuses.map(s => <option key={s}>{s}</option>)}</select></td><td className="p-3"><button type="button" onClick={() => deleteOrder(o)} disabled={saving} className="sticker-btn bg-peach px-3 py-2 text-xs" title="Delete order"><Trash2 size={15} /> Delete</button></td></tr>)}'
          if 'onClick={() => deleteOrder(o)}' not in s:
              if old not in s:
                  raise SystemExit('Could not find order row payment cell')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-delete-action.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/OrderDashboard.tsx .github/workflows/fix-delete-action.yml
          git commit -m "fix: show delete action"
          git push origin HEAD:feature/order-capacity-dashboard
