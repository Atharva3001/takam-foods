name: Re-enable Ukadiche Day 1 and Day 2

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-enable booking dates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('client/src/pages/ProductPage.tsx')
          s = p.read_text(encoding='utf-8')
          lines = s.splitlines()
          out = []
          for line in lines:
              if 'fullyBookedDays' in line or 'isSelectedDayFullyBooked' in line:
                  continue
              if 'const festivalDayMissing =' in line:
                  out.append('  const festivalDayMissing = isModak && !selectedFestivalDay;')
                  continue
              if 'currently fully booked' in line:
                  out.append(line.replace(' Day 1 &amp; Day 2 are currently fully booked.', ''))
                  continue
              if 'availableDays.map((day)' in line and 'Fully Booked' in line:
                  out.append('                      {availableDays.map((day) => <option key={day.date} value={`2026-09-${day.date.split(" ")[0].padStart(2, "0")}`}>{day.date} - Festival Day {GANAPATI_SCHEDULE.indexOf(day) + 1}</option>)}')
                  continue
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')

          p = Path('client/src/pages/GanapatiSpecial.tsx')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if 'dayProducts.map((product)' in line and 'Fully Booked' in line:
                  out.append('                      <div className="mt-3 flex flex-wrap gap-2">{dayProducts.map((product) => <Link key={product.slug} href={`/product/${product.slug}`} className="inline-flex items-center gap-1.5 bg-mint/50 border-2 border-ink rounded-full pl-1 pr-2.5 py-1 text-xs md:text-sm font-display font-bold hover:bg-mascot"><span className="h-7 w-7 shrink-0 overflow-hidden rounded-full border border-ink/20 bg-white flex items-center justify-center"><img src={product.images[0]} alt="" aria-hidden className={`h-full w-full ${product.images[0].includes("takam_modak_") ? "object-contain p-0.5" : "object-cover"}`} /></span>{product.marathi}</Link>)}</div>')
                  continue
              out.append(line)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Verify changes and build
        shell: bash
        run: |
          grep -RniE 'fullyBookedDays|isSelectedDayFullyBooked|Fully Booked|currently fully booked' client/src/pages/ProductPage.tsx client/src/pages/GanapatiSpecial.tsx && { echo 'Booking lock still present'; exit 1; } || true
          git diff -- client/src/pages/ProductPage.tsx client/src/pages/GanapatiSpecial.tsx
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ProductPage.tsx client/src/pages/GanapatiSpecial.tsx
          git diff --cached --quiet && { echo "No source changes found"; exit 1; }
          git commit -m "fix: re-enable Ukadiche booking for Day 1 and Day 2"
          git push origin main
          git rm .github/workflows/mark-ukadiche-day1-day2-booked.yml trigger-ukadiche-reenable.txt
          git commit -m "chore: remove temporary Ukadiche re-enable workflow"
          git push origin main
