name: Apply enquiry cart fix

on:
  push:
    branches:
      - feature/order-capacity-dashboard

permissions:
  contents: write

jobs:
  apply-fix:
    if: "!contains(github.event.head_commit.message, 'feat: add multi-modak enquiry cart')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-capacity-dashboard
          fetch-depth: 0

      - name: Patch product enquiry flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/ProductPage.tsx')
          s = p.read_text()

          if 'ENQUIRY_CART_KEY' in s:
              raise SystemExit('Cart fix already present')

          s = s.replace(
              'import { useState, type FormEvent } from "react";',
              'import { useEffect, useState, type FormEvent } from "react";'
          )
          s = s.replace(
              'import { MessageCircle, ArrowLeft, PlayCircle, ChevronRight } from "lucide-react";',
              'import { MessageCircle, ArrowLeft, PlayCircle, ChevronRight, Plus } from "lucide-react";'
          )

          marker = 'function Tape({ className = "" }: { className?: string }) {'
          cart_types = '''type EnquiryCartItem = {
            id: string;
            slug: string;
            marathi: string;
            english: string;
            selectedDay: string;
            festivalDayLabel: string;
            quantity: string;
            price: string;
          };

          const ENQUIRY_CART_KEY = "takam-enquiry-cart";

          function readEnquiryCart(): EnquiryCartItem[] {
            try {
              const stored = localStorage.getItem(ENQUIRY_CART_KEY);
              return stored ? JSON.parse(stored) : [];
            } catch {
              return [];
            }
          }

          '''
          s = s.replace(marker, cart_types + marker)

          s = s.replace(
              '  const [isOrderDialogOpen, setIsOrderDialogOpen] = useState(false);\n  const [showQuantityHint, setShowQuantityHint] = useState(false);',
              '''  const [isOrderDialogOpen, setIsOrderDialogOpen] = useState(false);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [cart, setCart] = useState<EnquiryCartItem[]>([]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showQuantityHint, setShowQuantityHint] = useState(false);

            useEffect(() => {
              setCart(readEnquiryCart());
            }, []);

            useEffect(() => {
              try {
                localStorage.setItem(ENQUIRY_CART_KEY, JSON.stringify(cart));
              } catch {
                // Ignore storage failures; the current-page cart still works.
              }
            }, [cart]);'''
          )

          start = s.index('  const waText = encodeURIComponent(')
          end = s.index('  const isMascotSrc =', start)
          new_logic = '''  const addCurrentItemToEnquiry = () => {
            if (orderIncomplete) {
              setShowQuantityHint(true);
              document.getElementById("quantity-selection")?.scrollIntoView({ behavior: "smooth", block: "center" });
              window.setTimeout(() => setShowQuantityHint(false), 2600);
              return;
            }

            const item: EnquiryCartItem = {
              id: `${product.slug}-${selectedDay}-${Date.now()}`,
              slug: product.slug,
              marathi: product.marathi,
              english: product.english,
              selectedDay,
              festivalDayLabel: selectedFestivalDay?.date || formatEnquiryDay(selectedDay),
              quantity: orderQuantity,
              price: orderPrice,
            };
            setCart((current) => [...current, item]);
            setIsCartOpen(true);
          };

          const captureEnquiries = async () => {
            if (!cart.length || nameMissing || mobileNumberMissing || deliveryAddressMissing) return false;
            const responses = await Promise.all(cart.map((item) => fetch("/api/dashboard/enquiries", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                productName: item.english,
                productSlug: item.slug,
                selectedDay: item.selectedDay,
                quantity: item.quantity,
                name: name.trim(),
                mobileNumber: normalizedMobileNumber,
                deliveryAddress: orderLocation,
              }),
            })));
            return responses.every((response) => response.ok);
          };

          const handleOrderSubmit = async (event: FormEvent<HTMLFormElement>) => {
            event.preventDefault();
            if (nameMissing || mobileNumberMissing || deliveryAddressMissing || cart.length === 0) return;
            setIsSubmitting(true);
            try {
              const captured = await captureEnquiries();
              if (!captured) return;

              const totalIndicative = cart.reduce((sum, item) => {
                const raw = item.price.replace(/[^0-9.]/g, "");
                const value = Number(raw);
                return Number.isFinite(value) ? sum + value : sum;
              }, 0);
              const lines = cart.map((item, index) => `${index + 1}. ${item.english}\n   Festival day: ${item.festivalDayLabel}\n   Quantity: ${item.quantity}\n   Indicative price: ${item.price}`).join("\n\n");
              const waText = encodeURIComponent(
                `नमस्कार टाकम! मला खालील Modak enquiry करायची आहे 😋\n\n${lines}\n\nName: ${name.trim()}\nMobile Number: ${normalizedMobileNumber}\nDelivery location: ${orderLocation}\nTotal indicative price: ₹${totalIndicative.toLocaleString("en-IN")}`
              );

              window.open(`https://wa.me/91${PHONE}?text=${waText}`, "_blank", "noopener,noreferrer");
              setCart([]);
              setIsOrderDialogOpen(false);
              setIsCartOpen(false);
            } finally {
              setIsSubmitting(false);
            }
          };

          '''
          s = s[:start] + new_logic + s[end:]

          old_cta = '''                <button
                  type="button"
                  aria-disabled={orderIncomplete}
                  onClick={() => {
                    if (orderIncomplete) {
                      setShowQuantityHint(true);
                      document.getElementById("quantity-selection")?.scrollIntoView({ behavior: "smooth", block: "center" });
                      window.setTimeout(() => setShowQuantityHint(false), 2600);
                      return;
                    }
                    setIsOrderDialogOpen(true);
                  }}
                  className={`sticker-btn bg-white px-7 py-3 text-lg flex items-center gap-2 rotate-1 ${orderIncomplete ? "cursor-not-allowed opacity-50" : ""}`}
                >
                  <MessageCircle className="h-5 w-5" /> Send Enquiry on WhatsApp
                </button>'''
          new_cta = '''                <div className="flex flex-wrap gap-2">
                  <button
                    type="button"
                    aria-disabled={orderIncomplete}
                    onClick={addCurrentItemToEnquiry}
                    className={`sticker-btn bg-white px-7 py-3 text-lg flex items-center gap-2 rotate-1 ${orderIncomplete ? "cursor-not-allowed opacity-50" : ""}`}
                  >
                    <Plus className="h-5 w-5" /> Add to enquiry
                  </button>
                  {cart.length > 0 && (
                    <button type="button" onClick={() => setIsCartOpen(true)} className="sticker-btn bg-mint px-5 py-3 text-base">
                      🛒 Review enquiry ({cart.length})
                    </button>
                  )}
                </div>'''
          if old_cta not in s:
              raise SystemExit('Primary CTA pattern not found')
          s = s.replace(old_cta, new_cta, 1)

          marker = '              <Dialog open={isOrderDialogOpen} onOpenChange={setIsOrderDialogOpen}>'
          cart_dialog = '''              <Dialog open={isCartOpen} onOpenChange={setIsCartOpen}>
                <DialogContent className="border-[3px] border-ink bg-cream shadow-[8px_8px_0_0_var(--ink)] p-5 sm:p-7 max-h-[85vh] overflow-y-auto">
                  <DialogHeader className="text-left">
                    <DialogTitle className="font-display text-2xl font-extrabold">Your Modak enquiry 🛒</DialogTitle>
                    <DialogDescription className="font-semibold text-ink/70">Select as many Modaks as you like. We’ll send everything together on WhatsApp.</DialogDescription>
                  </DialogHeader>
                  <div className="space-y-3">
                    {cart.map((item, index) => (
                      <div key={item.id} className="sticker bg-white p-4 flex gap-3 items-start">
                        <div className="min-w-0 flex-1">
                          <p className="font-display font-extrabold text-lg">{index + 1}. {item.marathi}</p>
                          <p className="text-xs font-bold text-muted-foreground">{item.english}</p>
                          <p className="mt-1 text-sm font-semibold">📅 {item.festivalDayLabel} · {item.quantity} · {item.price}</p>
                        </div>
                        <button type="button" onClick={() => setCart((current) => current.filter((entry) => entry.id !== item.id))} className="border-2 border-ink bg-peach px-2 py-1 text-xs font-display font-extrabold">Remove</button>
                      </div>
                    ))}
                    {cart.length === 0 && <p className="py-5 text-center font-bold text-muted-foreground">Your enquiry is empty.</p>}
                  </div>
                  <DialogFooter className="pt-2 sm:flex-row sm:justify-between">
                    <Link href="/ganapati-modak-special" onClick={() => setIsCartOpen(false)} className="border-[2.5px] border-ink bg-white px-4 py-2.5 font-display font-bold shadow-[2px_2px_0_0_var(--ink)] text-center">Add another Modak</Link>
                    <button type="button" disabled={cart.length === 0} onClick={() => { setIsCartOpen(false); setIsOrderDialogOpen(true); }} className={`sticker-btn bg-tomato text-primary-foreground px-5 py-2.5 flex items-center justify-center gap-2 ${cart.length === 0 ? "opacity-50" : ""}`}>
                      <MessageCircle className="h-4 w-4" /> Review & send all
                    </button>
                  </DialogFooter>
                </DialogContent>
              </Dialog>

'''
          if marker not in s:
              raise SystemExit('Checkout dialog marker not found')
          s = s.replace(marker, cart_dialog + marker, 1)

          s = s.replace(
              '<DialogDescription className="font-semibold text-ink/70">Just these details, then WhatsApp करा. Your selection: {selectedFestivalDay ? `${selectedFestivalDay.date} · ` : ""}{orderQuantity} · {orderPrice} indicative.</DialogDescription>',
              '<DialogDescription className="font-semibold text-ink/70">You have {cart.length} Modak selection{cart.length === 1 ? "" : "s"}. Add your contact details once and we’ll send the complete enquiry together.</DialogDescription>'
          )
          s = s.replace(
              '''<button type="submit" className="sticker-btn bg-tomato text-primary-foreground px-5 py-2.5 flex items-center justify-center gap-2">
                        <MessageCircle className="h-4 w-4" /> Continue to WhatsApp
                      </button>''',
              '''<button type="submit" disabled={isSubmitting} className="sticker-btn bg-tomato text-primary-foreground px-5 py-2.5 flex items-center justify-center gap-2 disabled:opacity-60">
                        <MessageCircle className="h-4 w-4" /> {isSubmitting ? "Preparing enquiry…" : "Continue to WhatsApp"}
                      </button>'''
          )

          old_bottom = '<section className="pb-14 md:pb-20"><div className="container max-w-3xl"><div className="sticker rotate-1 bg-white p-8 md:p-10 text-center space-y-5"><h2 className="font-display font-extrabold text-2xl md:text-3xl">{product.marathi} पाहिजे? मग enquiry करा! 🔥</h2><button type="button" disabled={orderIncomplete} onClick={() => setIsOrderDialogOpen(true)} className={`sticker-btn bg-mint px-7 py-3 text-lg flex items-center gap-2 mx-auto ${orderIncomplete ? "opacity-50" : ""}`}><MessageCircle className="h-5 w-5" /> Send Enquiry on WhatsApp</button></div></div></section>'
          new_bottom = '<section className="pb-14 md:pb-20"><div className="container max-w-3xl"><div className="sticker rotate-1 bg-white p-8 md:p-10 text-center space-y-5"><h2 className="font-display font-extrabold text-2xl md:text-3xl">{product.marathi} पाहिजे? मग enquiry मध्ये add करा! 🔥</h2><div className="flex flex-wrap justify-center gap-2"><button type="button" disabled={orderIncomplete} onClick={addCurrentItemToEnquiry} className={`sticker-btn bg-mint px-7 py-3 text-lg flex items-center gap-2 ${orderIncomplete ? "opacity-50" : ""}`}><Plus className="h-5 w-5" /> Add to enquiry</button>{cart.length > 0 && <button type="button" onClick={() => setIsCartOpen(true)} className="sticker-btn bg-peach px-5 py-3 text-base">🛒 Review all ({cart.length})</button>}</div></div></div></section>'
          if old_bottom not in s:
              raise SystemExit('Bottom CTA pattern not found')
          s = s.replace(old_bottom, new_bottom, 1)

          p.write_text(s)
          PY

      - name: Commit patched page
        shell: bash
        run: |
          rm -f .github/workflows/apply-enquiry-cart-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/ProductPage.tsx .github/workflows/apply-enquiry-cart-fix.yml
          git commit -m "feat: add multi-modak enquiry cart"
          git push origin HEAD:feature/order-capacity-dashboard
