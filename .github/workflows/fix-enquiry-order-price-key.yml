name: Fix enquiry order price key

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch product price key normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/dashboard-api.ts')
          s = p.read_text(encoding='utf-8')
          old = '''function normalisePriceProductName(name: string) {
            return normaliseProductName(name)
              .replace(/khava/g, "khava")
              .replace(/dry fruit/g, "dryfruit")
              .replace(/dryfruit/g, "dryfruit")
              .replace(/tilkund/g, "tilkund")
              .replace(/beet/g, "beet")
              .replace(/gulkand/g, "gulkand");
          }'''
          new = '''function normalisePriceProductName(name: string) {
            return normaliseProductName(name)
              .replace(/\\bmodak\\b/g, "")
              .replace(/\\s+/g, " ")
              .trim()
              .replace(/dry fruit/g, "dryfruit");
          }'''
          if old not in s:
              raise SystemExit('price normalizer block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/dashboard-api.ts
          git commit -m "fix: match modak names in enquiry pricing"
          git push origin main
          git rm .github/workflows/fix-enquiry-order-price-key.yml
          git commit -m "chore: remove temporary price fix workflow"
          git push origin main
